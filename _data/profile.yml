short_bio_text_justify: false
short_bio: >-
  <p>
    I'm a Senior Algorithm Scientist at <strong>Oura</strong>, where I work on algorithms for wearable
    health sensing, and an advisor to <strong>Morph Labs</strong>, which is building an EEG-based system for
    natural, non-invasive control of prosthetic limbs.
  </p>
  <p>
    My work sits where machine learning, signal processing, and neuroscience meet: I build models that turn
    noisy physiological signals into measurements of things that are otherwise hard to observe. I did my PhD in
    Electrical and Computer Engineering at Rice University with Behnaam Aazhang, developing technologies to
    measure how cerebrospinal fluid (CSF) moves through the human brain, from 7T MRI methods for perivascular
    flow to models that estimate CSF flow from overnight sleep recordings. Earlier, I used deep learning to
    reconstruct the 12-lead ECG from pacemaker signals. At Houston Methodist, I applied machine learning to
    neural interface data, from spinal cord recordings to intracranial and scalp EEG.
  </p>
  <p>
    I'm especially interested in the glymphatic system and the idea that impaired brain waste clearance drives
    neurodegeneration, in brain–computer interfaces, and in unsupervised learning methods that discover
    structure in data on their own. You can read more on my <a href="research">research page</a>.
  </p>

