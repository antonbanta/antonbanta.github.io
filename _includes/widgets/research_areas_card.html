<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <h6 class="mx-2 mb-3">Research areas <a href="{{ '/research' | relative_url }}">(read more <i class="fas fa-angle-double-right"></i>)</a></h6>
                <div class="row">
                    {% for section in site.data.research %}
                    <div class="col-sm-6 mb-3">
                        <a class="d-block h-100 p-3 border rounded text-body research-tile" href="{{ '/research' | relative_url }}#{{ section.id }}">
                            <div class="font-weight-bold mb-1"><i class="{{ section.icon }} mr-2 accent-icon"></i>{{ section.title }}</div>
                            <div class="small text-muted">{{ section.short }}</div>
                        </a>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
